name: Supabase

# Applies database migrations to the linked Supabase project on merge to main, and on PRs
# guards against schema drift (lint + generated-types check).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   Account Personal Access Token from
#                           https://supabase.com/dashboard/account/tokens
#                           Format: sbp_ + 40 lowercase hex chars (NOT a project API key)
#   SUPABASE_DB_PASSWORD    Database password for the linked project
#   SUPABASE_PROJECT_ID     Project ref from Project Settings → General (20-char id)
#
# Staging (workflow_dispatch only):
#   SUPABASE_STAGING_PROJECT_ID, SUPABASE_STAGING_DB_PASSWORD

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "src/types/database.ts"
      - ".github/workflows/supabase.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "src/types/database.ts"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift-check:
    name: Lint + types drift guard
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v2
        with:
          version: 2.108.0
      - name: Validate CI secrets
        run: bash .github/scripts/validate-supabase-secrets.sh production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Lint migrations
        run: supabase db lint --linked
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Verify generated types are committed and up to date
        run: |
          supabase gen types typescript --linked > src/types/database.generated.ts
          sed -i -e '${/^$/d;}' src/types/database.generated.ts
          sed -i -e '${/^$/d;}' src/types/database.ts
          if ! diff -u src/types/database.ts src/types/database.generated.ts; then
            echo "::error::src/types/database.ts is out of date. Run 'npm run db:types' and commit the result."
            exit 1
          fi

  db-push:
    name: Apply migrations (production)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Optional: add `environment: production` after creating it in Settings → Environments.
    concurrency:
      group: supabase-migrate-production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v2
        with:
          version: 2.108.0
      - name: Validate CI secrets
        run: bash .github/scripts/validate-supabase-secrets.sh production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Push migrations
        run: supabase db push
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  functions-deploy:
    name: Deploy Edge Functions (production)
    needs: db-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Optional: add `environment: production` after creating it in Settings → Environments.
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v2
        with:
          version: 2.108.0
      - name: Validate CI secrets
        run: bash .github/scripts/validate-supabase-secrets.sh production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Deploy functions
        run: supabase functions deploy health rotate-daily-challenge

  staging-migrate:
    name: Apply migrations (staging)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: supabase-migrate-staging
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v2
        with:
          version: 2.108.0
      - name: Validate staging secrets
        run: bash .github/scripts/validate-supabase-secrets.sh staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_ID: ${{ secrets.SUPABASE_STAGING_PROJECT_ID }}
          SUPABASE_STAGING_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
      - name: Link staging project
        run: supabase link --project-ref "$SUPABASE_STAGING_PROJECT_ID"
        env:
          SUPABASE_STAGING_PROJECT_ID: ${{ secrets.SUPABASE_STAGING_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
      - name: Push migrations to staging
        run: supabase db push
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
